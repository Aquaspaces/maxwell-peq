[workspace]
resolver = "3"
members = ["crates/maxwell-core", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.89"
repository = "https://github.com/Aquaspaces/maxwell-peq"

[workspace.dependencies]
maxwell-core = { path = "crates/maxwell-core" }
serde_json = { version = "1", features = ["float_roundtrip", "preserve_order"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true

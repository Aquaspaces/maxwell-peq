<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>Maxwell PEQ</title>
  <link rel="stylesheet" href="/flyout.css">
  <script src="/flyout.js" defer></script>
</head>
<body>
  <svg width="0" height="0" class="icon-defs" aria-hidden="true">
    <symbol id="i-mic" viewBox="0 0 20 20"><rect x="7.25" y="2.75" width="5.5" height="9" rx="2.75"/><path d="M4.75 9.5a5.25 5.25 0 0 0 10.5 0M10 14.75v2.5"/></symbol>
    <symbol id="i-mic-off" viewBox="0 0 20 20"><path d="M12.75 8.5V5.5a2.75 2.75 0 0 0-5.3-1M7.25 7.75v1A2.75 2.75 0 0 0 11.6 11M4.75 9.5a5.25 5.25 0 0 0 8.5 4.1m1.8-2.6a5.2 5.2 0 0 0 .2-1.5M10 14.75v2.5M3 3l14 14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 20 20"><path d="m6 8 4 4 4-4"/></symbol>
    <symbol id="i-check" viewBox="0 0 20 20"><path d="m5 10.5 3.25 3.25L15 7"/></symbol>
    <symbol id="i-settings" viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.5"/><path d="M8.6 2.75h2.8l.45 2.05 1.4.8 2-.65 1.4 2.4-1.55 1.4v1.6l1.55 1.4-1.4 2.4-2-.65-1.4.8-.45 2.05H8.6l-.45-2.05-1.4-.8-2 .65-1.4-2.4 1.55-1.4v-1.6L3.35 7.4l1.4-2.4 2 .65 1.4-.8Z"/></symbol>
  </svg>

  <main class="panel">
    <section class="gauge" aria-labelledby="level">
      <svg class="arc" viewBox="0 0 200 200" aria-hidden="true">
        <path class="track" pathLength="100" d="M46.26 153.74A76 76 0 1 1 153.74 153.74"/>
        <path class="fill" id="arc-fill" pathLength="100" d="M46.26 153.74A76 76 0 1 1 153.74 153.74"/>
      </svg>
      <div class="reading">
        <p class="level" id="level">—</p>
        <p class="caption" id="caption">Reading the headset…</p>
      </div>

      <div class="mic" id="mic" role="img" aria-label="Mic state unknown" title="Mic state unknown">
        <svg><use href="#i-mic" id="mic-icon"/></svg>
      </div>

      <div class="eq">
        <button type="button" class="pill" id="eq-button" aria-haspopup="menu" aria-expanded="false" aria-controls="eq-menu">
          <span id="eq-label">EQ</span><svg><use href="#i-chevron"/></svg>
        </button>
      </div>

      <div class="menu" id="eq-menu" role="menu" aria-label="Custom presets" hidden></div>
    </section>

    <footer class="footer">
      <p class="device" id="device" aria-live="polite">Maxwell PEQ</p>
      <button type="button" class="icon-button" id="open-editor" title="Open Maxwell PEQ" aria-label="Open Maxwell PEQ">
        <svg><use href="#i-settings"/></svg>
      </button>
    </footer>
  </main>
</body>
</html>

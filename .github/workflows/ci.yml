name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # The hidapi backend is what macOS uses; check it on Windows too.
      - name: Clippy (hidapi backend)
        if: runner.os == 'Windows'
        run: cargo clippy -p maxwell-core --features hidapi --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Check web scripts
        run: |
          node --check web/app.js
          node --check web/graph.js
